name: Validate Lelefa Chambers

on:
  pull_request:
  push:
    branches:
      - main
      - feature/dynamic-cms-foundation
      - feature/chambers-operations-phase-2
      - feature/legal-recovery-phase-3
      - feature/recovery-automation-phase-4
      - feature/production-hardening-phase-5
      - feature/production-edge-routing
      - feature/production-image-release

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall apps/api/app apps/api/tests apps/api/alembic
      - run: python -c "import sys; sys.path.insert(0, 'apps/api'); import app.server; import app.worker; print('Combined API and worker import OK')"
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          JWT_SECRET: "ci-secret-only"
          BOOTSTRAP_ADMIN_PASSWORD: "ci-admin-password"
          LELEFA_DEBT_COLLECTORS_API_KEY: "ci-integration-key"
          LEGAL_VAULT_DIR: "/tmp/lelefa-chambers-ci-vault"
          ITHUTE_PAY_ENABLED: "false"
          ITHUTE_PAY_API_KEY: "ipb_test_ci-placeholder"
          ITHUTE_PAY_WEBHOOK_SECRET: "ci-webhook-secret"
      - working-directory: apps/api
        run: pytest -q
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          JWT_SECRET: "ci-secret-only"
          BOOTSTRAP_ADMIN_PASSWORD: "ci-admin-password"
          LELEFA_DEBT_COLLECTORS_API_KEY: "ci-integration-key"
          LEGAL_VAULT_DIR: "/tmp/lelefa-chambers-ci-vault"
          ITHUTE_PAY_ENABLED: "false"
          ITHUTE_PAY_API_KEY: "ipb_test_ci-placeholder"
          ITHUTE_PAY_WEBHOOK_SECRET: "ci-webhook-secret"
      - name: Validate Alembic baseline on a fresh database
        working-directory: apps/api
        run: |
          rm -f ci-alembic.db
          alembic upgrade head
          alembic current | grep -q 0001_baseline
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite+pysqlite:///./ci-alembic.db"
          JWT_SECRET: "ci-secret-only"
          BOOTSTRAP_ADMIN_PASSWORD: "ci-admin-password"
          LELEFA_DEBT_COLLECTORS_API_KEY: "ci-integration-key"
          LEGAL_VAULT_DIR: "/tmp/lelefa-chambers-ci-vault"
          ITHUTE_PAY_ENABLED: "false"
          ITHUTE_PAY_API_KEY: "ipb_test_ci-placeholder"
          ITHUTE_PAY_WEBHOOK_SECRET: "ci-webhook-secret"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/web
        run: npm install
      - working-directory: apps/web
        run: npm run build
        env:
          SERVER_API_URL: "http://127.0.0.1:8000"
          NEXT_PUBLIC_API_URL: "https://lelefachambers.co.ls"
          NEXT_PUBLIC_SITE_URL: "https://lelefachambers.co.ls"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: sed -i 's/CHANGE_THIS_DATABASE_PASSWORD/ci-db-password/g; s/CHANGE_THIS_LONG_RANDOM_SECRET/ci-jwt-secret/g; s/CHANGE_THIS_ADMIN_PASSWORD/ci-admin-password/g; s/CHANGE_THIS_DEBT_COLLECTORS_INTEGRATION_KEY/ci-integration-key/g; s/CHANGE_THIS_ITHUTE_PAY_APPLICATION_KEY/ipb_test_ci-placeholder/g; s/CHANGE_THIS_ITHUTE_PAY_WEBHOOK_SECRET/ci-webhook-secret/g' .env
      - run: docker compose config >/tmp/compose.txt
      - run: docker compose config --services | grep -qx worker
      - name: Confirm web and API are loopback-only
        run: |
          grep -q '127.0.0.1' /tmp/compose.txt
          grep -q 'target: 3000' /tmp/compose.txt
          grep -q 'target: 8000' /tmp/compose.txt
      - name: Validate image-only production Compose stack
        run: |
          docker compose -f compose.images.yaml config >/tmp/compose-images.txt
          grep -q 'ghcr.io/ithute-stak/lelefachambers-api:latest' /tmp/compose-images.txt
          grep -q 'ghcr.io/ithute-stak/lelefachambers-web:latest' /tmp/compose-images.txt
          grep -q '127.0.0.1' /tmp/compose-images.txt
      - name: Validate operations, edge and image deployment scripts
        run: bash -n scripts/backup-postgres.sh scripts/restore-postgres.sh scripts/backup-legal-vault.sh scripts/verify-production.sh scripts/prepare-nginx-host.sh scripts/issue-letsencrypt.sh scripts/check-production-dns.sh scripts/deploy-images.sh
      - name: Validate production domain and image templates
        run: |
          grep -q 'lelefachambers.co.ls' deploy/nginx/lelefachambers-bootstrap.conf
          grep -q 'api.lelefachambers.co.ls' deploy/nginx/lelefachambers-production.conf
          grep -q 'NEXT_PUBLIC_API_URL=https://lelefachambers.co.ls' .env.production.example
          grep -q 'LELEFA_IMAGE_TAG=latest' .env.production.example
          grep -q 'packages: write' .github/workflows/publish-images.yml
          test -f 'apps/web/app/api/v1/[...path]/route.ts'
