name: Publish Lelefa Chambers Images

on:
  workflow_run:
    workflows: ["Validate Lelefa Chambers"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: lelefachambers-release-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish tested images
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/lelefachambers-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/lelefachambers-web

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.API_IMAGE }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/ithute-stak/lelefachambers
            org.opencontainers.image.title=Lelefa Chambers API
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=https://lelefachambers.co.ls
            NEXT_PUBLIC_SITE_URL=https://lelefachambers.co.ls
            SERVER_API_URL=http://api:8000
          tags: ${{ env.WEB_IMAGE }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/ithute-stak/lelefachambers
            org.opencontainers.image.title=Lelefa Chambers Web
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Release summary
        run: |
          echo "Lelefa Chambers production images were built on GitHub and published only."
          echo "No VPS deployment was performed."
          echo "API: ${API_IMAGE}:${RELEASE_SHA}"
          echo "Web: ${WEB_IMAGE}:${RELEASE_SHA}"
          echo "Deploy manually from the production VPS only after this workflow is green."
